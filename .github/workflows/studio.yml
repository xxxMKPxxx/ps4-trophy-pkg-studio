name: build studio

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # 需要写权限：构建完成（或失败）后把结果推到 builds 分支
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 取上游模板资源与依赖
        shell: pwsh
        run: |
          # 目录名必须是 PS4_Tools，csproj 里引用的是 ..\PS4_Tools\TrophyUnlocker\bin\Release\PS4_Tools.dll
          git clone --depth 1 https://github.com/xXxTheDarkprogramerxXx/PS4_Tools.git PS4_Tools
          if (-not (Test-Path '.\PS4_Tools\TrophyUnlocker\Resources\CONTENTS.zip')) {
            throw '上游 Resources 里没有 CONTENTS.zip'
          }
          if (-not (Test-Path '.\PS4_Tools\TrophyUnlocker\bin\Release\PS4_Tools.dll')) {
            throw '上游 bin\Release 里没有 PS4_Tools.dll'
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 编译
        shell: pwsh
        run: |
          # 输出同时进日志文件：构建失败时这个文件会被推到 builds 分支，方便直接看原因
          msbuild .\pkg-studio\PkgStudio.csproj `
            /p:Configuration=Release /p:Platform=AnyCPU `
            /verbosity:minimal /nologo 2>&1 | Tee-Object -FilePath build.log

          # 不看退出码，直接看产物；msbuild 有时会带着错误返回 0
          if (-not (Test-Path '.\pkg-studio\bin\Release\PkgStudio.exe')) {
            throw "编译失败：没有生成 PkgStudio.exe（完整日志见 builds 分支的 build.log）"
          }

      - name: 组装产物
        shell: pwsh
        run: |
          $out = '.\pkg-studio\bin\Release'
          if (-not (Test-Path "$out\PkgStudio.exe")) { throw "没有生成 PkgStudio.exe" }

          # 模板资源放到 exe 旁边的 template 目录，程序默认从那里读
          New-Item -ItemType Directory -Force -Path "$out\template" | Out-Null
          Copy-Item '.\PS4_Tools\TrophyUnlocker\Resources\*' "$out\template\" -Recurse -Force

          # PS4_Tools.dll 运行时还会用到同目录的其它依赖，一并拷过去
          Copy-Item '.\PS4_Tools\TrophyUnlocker\bin\Release\*.dll' "$out\" -Force

          # 取最新构建的解锁器 eboot（app-builds 分支），放到 template 下，
          # 打 pkg 时会自动替换模板自带的那个 eboot
          # 要的是 eboot.oelf（SCE ELF）：img_create 只接受 ELF，
          # 而普通 ELF / 假 SCE ELF 装进去会 CE-30045-2 / CE-41839-5
          git fetch --depth 1 origin app-builds 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout FETCH_HEAD -- eboot.oelf 2>$null
            if (Test-Path '.\eboot.oelf') {
              $bytes = [System.IO.File]::ReadAllBytes('.\eboot.oelf')
              $eType = [BitConverter]::ToUInt16($bytes, 16)
              if ($eType -ne 0xFE10) {
                throw ("app-builds 里的 eboot.oelf 不是 SCE ELF（e_type=0x{0:X4}）" -f $eType)
              }
              Copy-Item '.\eboot.oelf' "$out\template\eboot.bin" -Force
              Write-Host ("已放入解锁器 eboot：SCE ELF {0} 字节" -f $bytes.Length)
            } else {
              throw 'app-builds 里没有 eboot.oelf，不能带着模板自带的 eboot 打包'
            }
          } else {
            throw 'app-builds 分支取不到（先跑一次 unlocker app 构建）'
          }

          # 界面字体：解锁器界面用 FreeType 画中文，读 /app0/font.ttf，打 pkg 时塞进去
          $font = '.\unlocker-app\assets\font.ttf'
          if (-not (Test-Path $font)) { throw '缺 unlocker-app\assets\font.ttf（界面字体）' }
          Copy-Item $font "$out\template\font.ttf" -Force
          Write-Host ("已放入界面字体：{0:N1} MB" -f ((Get-Item $font).Length / 1MB))

          # 奖杯图标：打 pkg 时叠到游戏封面上，生成解锁器的 icon0.png
          $cup = '.\pkg-studio\assets\icon1.png'
          if (-not (Test-Path $cup)) { throw '缺 pkg-studio\assets\icon1.png（奖杯图标）' }
          Copy-Item $cup "$out\template\icon1.png" -Force
          Write-Host ("已放入奖杯图标：{0:N1} KB" -f ((Get-Item $cup).Length / 1KB))

          Get-ChildItem "$out" -Filter *.dll | Select-Object Name, Length | Format-Table

          # 公开发布合规：orbis-pub-cmd.exe（Sony SDK 专有工具）与 CONTENTS.zip
          # （内含 Sony SDK 官方 np_trophy sample eboot）不随本仓库产物分发。
          # 使用者按 template/README.txt 指引自行从上游 PS4_Tools 获取。
          Remove-Item "$out\template\orbis-pub-cmd.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item "$out\template\CONTENTS.zip" -Force -ErrorAction SilentlyContinue
          # 注意：不要在这里用 PowerShell here-string —— 其结束符 '@ 必须顶格，
          # 会提前终止 YAML 块标量导致整个 workflow 解析失败。
          $readme = @(
            '本仓库不分发 Sony SDK 专有文件（orbis-pub-cmd.exe、CONTENTS.zip）。',
            '',
            '首次使用前请自行获取并放入本 template 目录（与 README.txt 同级）：',
            '  1. git clone https://github.com/xXxTheDarkprogramerxXx/PS4_Tools.git',
            '  2. 复制 PS4_Tools\TrophyUnlocker\Resources\ 下的 CONTENTS.zip、*.gp4、',
            '     orbis-pub-cmd.exe 到本目录'
          )
          $readme | Set-Content "$out\template\README.txt" -Encoding utf8
          Write-Host '已剔除 Sony 专有文件，写入 template/README.txt（获取指引）'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PkgStudio
          path: |
            pkg-studio/bin/Release/**
            build.log

      # 把结果提交到 builds 分支：不登录也能拿到，也方便直接从别处 git 取
      - name: 发布到 builds 分支
        if: always()
        shell: pwsh
        run: |
          $zip = 'PkgStudio-build.zip'
          if (Test-Path '.\pkg-studio\bin\Release\PkgStudio.exe') {
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path '.\pkg-studio\bin\Release\*' -DestinationPath $zip -Force
            Write-Host ("打包完成: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB))
          }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 孤立分支：只放产物，不带源码历史
          git checkout --orphan builds
          git reset

          if (Test-Path $zip)      { git add -f $zip }
          if (Test-Path 'build.log') { git add -f build.log }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '没有可提交的产物'
            exit 0
          }

          git commit -m "build $env:GITHUB_SHA"
          git push -f origin HEAD:refs/heads/builds

      # 打 v* tag 推送时，把产物 zip 挂到 GitHub Release 上
      # （产物已剔除 Sony 专有文件，可公开发布）
      # 更新说明取自仓库根目录 CHANGELOG.md 里 `## [<tag>]` 那一节；
      # 注意：这里不能用 here-string，'@ 顶格会截断 YAML 块标量（v1.0.0 踩过）
      - name: 发布 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = 'PkgStudio-build.zip'
          if (-not (Test-Path $zip)) { throw '构建产物 zip 不存在，无法发布 Release' }
          $rel = "PkgStudio-$tag.zip"
          Copy-Item $zip $rel -Force
          Write-Host ("发布 {0}：{1:N1} MB" -f $tag, ((Get-Item $rel).Length / 1MB))

          $head = '下载 PkgStudio-' + $tag + '.zip 解压即用。公开包按合规不含 Sony 专有文件（orbis-pub-cmd.exe / CONTENTS.zip 等），首次打包前请按 template/README.txt 自行补齐。'
          $notes = $head

          if (Test-Path 'CHANGELOG.md') {
            $all = Get-Content 'CHANGELOG.md' -Raw -Encoding utf8
            $pat = '(?ms)^##\s*\[' + [regex]::Escape($tag) + '\][^\r\n]*\r?\n(.*?)(?=^##\s*\[|\z)'
            $m = [regex]::Match($all, $pat)
            if ($m.Success) {
              $link = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/blob/' + $tag + '/CHANGELOG.md'
              $notes = $head + "`n`n" + $m.Groups[1].Value.Trim() + "`n`n完整变更见 [CHANGELOG.md](" + $link + ')。'
              Write-Host ('已引用 CHANGELOG.md 里 ' + $tag + ' 的章节作为更新说明')
            } else {
              Write-Host ('CHANGELOG.md 里没有 ' + $tag + ' 章节，使用默认说明')
            }
          } else {
            Write-Host 'CHANGELOG.md 不存在，使用默认说明'
          }

          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8
          gh release create $tag $rel --title "PkgStudio $tag" --notes-file 'release-notes.md'
