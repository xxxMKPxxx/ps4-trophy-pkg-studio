name: build unlocker app

# 独立 pkg 版的 eboot（在 Unlocker 的 pkg 里跑，不依赖插件）
# 产物：
#   eboot.oelf —— SCE ELF（Orbis ELF），pkg 里当 eboot.bin 用
#   eboot.self —— 同名 SELF（备用）
on:
  push:
    branches:
      - 'feat/**'
      - 'main'
    paths:
      - 'unlocker-app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 先建日志：后面任何一步失败，这一步产生的文件也会被推到 app-builds，
      # 否则失败时分支不变，外面根本看不出跑没跑
      - name: 初始化构建日志
        run: |
          echo "run start $(date -u) ${GITHUB_SHA}" > app-build.log
          echo "runner $(uname -a)" >> app-build.log

      - name: Install llvm/lld
        run: |
          set -x
          sudo apt-get update 2>&1 | tail -20
          sudo apt-get install -y llvm lld 2>&1 | tail -20
          clang --version || true
          ld.lld --version || true

      - name: Download OpenOrbis toolchain
        working-directory: unlocker-app
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/toolchain.tar.gz \
            https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz
          ls -l /tmp/toolchain.tar.gz
          tar xzf /tmp/toolchain.tar.gz -C ./
          ls OpenOrbis/PS4Toolchain/bin/linux
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/unlocker-app/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Build eboot
        working-directory: unlocker-app
        run: |
          {
            echo "=== $(date -u) build start ==="
            make clean && make
          } 2>&1 | tee ../app-build.log

      - name: 检查产物（必须是 SCE ELF，带 SCE 段）
        working-directory: unlocker-app
        run: |
          ls -l eboot.oelf eboot.self
          python3 - <<'EOF'
          import struct, sys

          d = open('eboot.oelf', 'rb').read()
          assert d[:4] == b'\x7fELF', 'eboot.oelf 不是 ELF'
          e_type = struct.unpack_from('<H', d, 16)[0]
          osabi  = d[7]
          phoff  = struct.unpack_from('<Q', d, 32)[0]
          phes   = struct.unpack_from('<H', d, 54)[0]
          phnum  = struct.unpack_from('<H', d, 56)[0]
          types = []
          for i in range(phnum):
              o = phoff + i * phes
              types.append(struct.unpack_from('<I', d, o)[0])
          print('size', len(d), 'e_type', hex(e_type), 'osabi', osabi)
          print('phdrs', [hex(t) for t in types])

          ok = (e_type == 0xFE10 and 0x61000010 in types and 0x61000001 in types)
          if not ok:
              sys.exit('不是 SCE ELF：缺 e_type=0xFE10 或 PT_SCE_RELA(0x61000010) / PT_SCE_PROCPARAM(0x61000001)')
          print('SCE ELF 检查通过')
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlocker-eboot
          path: |
            unlocker-app/eboot.oelf
            unlocker-app/eboot.self
            app-build.log
          if-no-files-found: warn

      - name: 发布到 app-builds 分支
        if: always()
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout --orphan app-builds
          git reset

          # eboot.oelf = SCE ELF，img_create 要的就是这个（给 SELF 会被拒：already converted）
          if [ -f unlocker-app/eboot.oelf ]; then
            cp unlocker-app/eboot.oelf ./eboot.oelf
            git add -f eboot.oelf
          fi
          if [ -f unlocker-app/eboot.self ]; then
            cp unlocker-app/eboot.self ./eboot.self
            git add -f eboot.self
          fi
          if [ -f app-build.log ]; then git add -f app-build.log; fi

          if git diff --cached --quiet; then
            echo '没有可提交的产物'
            exit 0
          fi

          git commit -m "eboot ${GITHUB_SHA}"
          git push -f origin HEAD:refs/heads/app-builds
