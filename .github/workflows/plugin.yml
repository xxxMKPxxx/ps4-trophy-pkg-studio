name: build prx

# main 上不动；功能分支（feat/**）推上去会自动构建，方便试新功能。
on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

jobs:
  prx:
    runs-on: ubuntu-latest

    # 构建后把 prx 和编译日志推到 prx-builds 分支，方便直接取用
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install llvm/lld
        run: sudo apt-get update && sudo apt-get install -y llvm lld

      - name: Download OpenOrbis toolchain
        working-directory: ps4-trophy-plugin
        run: |
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/ps4-trophy-plugin/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Checkout GoldHEN Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: ps4-trophy-plugin/SDK

      - name: Build SDK
        working-directory: ps4-trophy-plugin
        run: |
          echo "GOLDHEN_SDK=$GITHUB_WORKSPACE/ps4-trophy-plugin/SDK" >> $GITHUB_ENV
          make -C SDK PRINTF=1

      - name: Build plugin
        working-directory: ps4-trophy-plugin
        run: make clean && make 2>&1 | tee ../build.log

      - name: List output
        working-directory: ps4-trophy-plugin
        run: ls -l *.prx

      - name: Upload prx
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trophy_unlocker
          path: |
            ps4-trophy-plugin/*.prx
            build.log
          if-no-files-found: warn

      - name: 发布到 prx-builds 分支
        if: always()
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout --orphan prx-builds
          git reset

          if ls ps4-trophy-plugin/*.prx >/dev/null 2>&1; then
            cp ps4-trophy-plugin/*.prx ./trophy_unlocker.prx
            git add -f trophy_unlocker.prx
          fi
          if [ -f build.log ]; then git add -f build.log; fi

          if git diff --cached --quiet; then
            echo '没有可提交的产物'
            exit 0
          fi

          git commit -m "prx ${GITHUB_SHA}"
          git push -f origin HEAD:refs/heads/prx-builds
